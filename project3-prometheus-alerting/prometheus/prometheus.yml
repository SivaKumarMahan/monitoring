global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: demo-app
    static_configs:
      - targets: ['demo-app:8080']
