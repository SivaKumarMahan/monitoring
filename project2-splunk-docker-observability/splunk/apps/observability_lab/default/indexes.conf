# Event index for application logs sent through HEC.
# Small limits on purpose: this is a single-node lab.
[app_logs]
homePath   = $SPLUNK_DB/app_logs/db
coldPath   = $SPLUNK_DB/app_logs/colddb
thawedPath = $SPLUNK_DB/app_logs/thaweddb
# Keep 30 days, then delete (no frozen archive in the lab)
frozenTimePeriodInSecs = 2592000
# Cap the whole index at 1 GB
maxTotalDataSizeMB = 1024
