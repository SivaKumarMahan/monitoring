# JSON access logs from the log generator (sent to /services/collector/event).
# HEC "event" endpoint events already have a timestamp from the "time" field,
# so no TIME_FORMAT is needed. Fields are extracted at search time.
[lab:app:json]
category = Application
description = JSON web access events from the observability lab
pulldown_type = true
SHOULD_LINEMERGE = false
TRUNCATE = 10000
KV_MODE = json
# Calculated fields used by the alerts and the dashboard
EVAL-is_error = if(tonumber(status) >= 500, 1, 0)
EVAL-status_class = substr(tostring(status), 1, 1) . "xx"
FIELDALIAS-response_time = duration_ms AS response_time_ms
