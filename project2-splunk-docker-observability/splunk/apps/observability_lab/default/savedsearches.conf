# Alerts for the observability lab. They run every 5 minutes over the last
# 5-10 minutes and are listed under Activity > Triggered Alerts.
# Real routing (email, Slack, PagerDuty, webhook) needs credentials, so only
# "alert.track" is enabled here. See the README for how to add an action.

[Lab - High 5xx error rate]
description = More than 5% of requests for a service returned 5xx in the last 5 minutes (minimum 20 requests).
search = index=app_logs sourcetype="lab:app:json" \
| stats count AS total, sum(is_error) AS errors BY service \
| eval error_pct = round(errors / total * 100, 2) \
| where total >= 20 AND error_pct > 5
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = service
alert.suppress.period = 30m
alert_type = number of events

[Lab - p95 latency above 800 ms]
description = p95 response time of a service is above 800 ms in the last 10 minutes.
search = index=app_logs sourcetype="lab:app:json" \
| stats count, perc95(duration_ms) AS p95_ms BY service \
| where count >= 20 AND p95_ms > 800
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = service
alert.suppress.period = 30m
alert_type = number of events

[Lab - No events received]
description = No events arrived in app_logs in the last 10 minutes (pipeline or HEC is broken).
search = | tstats count WHERE index=app_logs \
| where count = 0
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
alert_type = number of events

# Report (not an alert) - handy for weekly reviews
[Lab - Errors by endpoint (24h)]
description = 5xx count and error percent per endpoint over the last 24 hours.
search = index=app_logs sourcetype="lab:app:json" \
| stats count AS total, sum(is_error) AS errors BY service, path \
| eval error_pct = round(errors / total * 100, 2) \
| sort - errors
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
